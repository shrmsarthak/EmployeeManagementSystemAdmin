{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark text-white p-4">
                <div class="card-header text-center">
                    <h4>Add New Category</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        
                        <div class="mb-3">
                            <label for="categoryname" class="form-label">Category Name</label>
                            <input type="text" class="form-control" id="categoryname" name="categoryname" required>
                        </div>

                        <div class="mb-3">
                            <label for="checkintime" class="form-label">Check-In Time</label>
                            <input type="time" class="form-control" id="checkintime" name="checkintime" required>
                        </div>
                        <div class="mb-3">
                            <label for="checkouttime" class="form-label">Check-Out Time</label>
                            <input type="time" class="form-control" id="checkouttime" name="checkouttime" required>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-primary">Add Category</button>
                            <a href="{{ url_for('view_employee_category') }}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% if success %}
<script>
    Swal.fire({
        icon: 'success',
        title: 'Category Added',
        text: 'The category has been added successfully.',
        confirmButtonText: 'OK'
    });
</script>
{% endif %}

{% if error %}
<script>
    Swal.fire({
        icon: 'error',
        title: 'Error While Adding',
        text: 'An error occurred while adding the category.',
        confirmButtonText: 'OK'
    });
</script>
{% endif %}

{% endblock %}
