{% extends 'base.html' %}

{% block content %}
<br>
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-12">
            <div class="card p-3 p-md-4 bg-dark text-white">
                <h4 class="mb-3 text-center">Unit List</h4>

                <div class="table-responsive">
                    <table class="table table-striped table-dark table-bordered text-center text-nowrap">
                        <thead>
                            <tr>
                                <th>Unit Name</th>
                                <th>Latitude</th>
                                <th>Longitude</th>
                                <th>Username</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for key, value in units.items() %}
                            <tr>
                                <td>{{ value.unit_name }}</td>
                                <td>{{ value.latitude }}</td>
                                <td>{{ value.longitude }}</td>
                                <td>{{ value.username }}</td>
                                <td>
                                    <a href="{{ url_for('edit_unit', unit_name=key) }}" class="btn btn-warning btn-sm">Edit</a>
                                    <a href="{{ url_for('delete_unit', unit_name=key) }}" class="btn btn-danger btn-sm"
                                        onclick="return confirm('Are you sure you want to delete this unit?');">Delete</a>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
