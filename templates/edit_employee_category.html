{% extends 'base.html' %}

{% block content %}
<br>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 bg-dark text-white">
                <h4 class="text-center">Edit Employee Category</h4>

                <form method="POST">
                    <div class="mb-3">
                        <label for="categoryname" class="form-label">Category Name</label>
                        <input type="text" class="form-control" id="categoryname" name="categoryname"
                            value="{{ category.categoryname }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="checkintime" class="form-label">Check-In Time</label>
                        <input type="time" class="form-control" id="checkintime" name="checkintime"
                            value="{{ category.checkintime }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="checkouttime" class="form-label">Check-Out Time</label>
                        <input type="time" class="form-control" id="checkouttime" name="checkouttime"
                            value="{{ category.checkouttime }}" required>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-success">Update Category</button>
                        <a href="{{ url_for('view_employee_category') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
